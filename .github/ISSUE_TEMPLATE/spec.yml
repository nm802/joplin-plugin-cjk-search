name: 仕様（Spec）
description: 実装前に書く仕様。AIエージェントへの入力になる。
title: "[spec] "
labels: ["spec"]
body:
  - type: markdown
    attributes:
      value: |
        **このissueが仕様書そのもの。実装はここに書かれた内容だけを作る。**

        - 受け入れ条件は pass/fail で判定できる形にする。曖昧な条件はAIに対して機能しない
        - 未確定のことは埋めずに `NEEDS CLARIFICATION:` と書いて残す。埋めるとAIが勝手に決める
        - 実装後にこのissueは更新しない。恒久的な仕様と決定の理由は `docs/` に移す
        - **テストケース一覧をこのissueに書き、承認を得てから実装に着手する。**
          Discordやチャットに出して終わりにしない（記録が残らず後から検証できない）
        - **検証は2種類に分けて書く。** 将来のあらゆる変更から守る「保護のためのテスト」と、
          この変更が入ったかを見るだけの「変更確認」。**判定は「今後も落ちうるか」。**
          入った時点で二度と落ちないものはテストにしない——残るのは実行時間だけ

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: このissueが何を実現するか。1文で。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景・課題
      description: なぜこの作業が必要か。何が問題か。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件（Given / When / Then）
      description: 完了したと言える条件。そのままテストになる形で書く。
      value: |
        - [ ] **Given** 前提の状態 / **When** 操作 / **Then** 期待する結果
        - [ ] **Given** 前提の状態 / **When** 操作 / **Then** 期待する結果
    validations:
      required: true

  - type: textarea
    id: testcases
    attributes:
      label: テストケース一覧（保護のためのテスト）
      description: |
        **将来のあらゆる変更に対して不変条件を守るテストだけを書く。** ずっと走り続ける。
        この変更が入ったかを見るだけの検証は、下の「変更確認」へ書く。

        実装着手前に埋めてレビューを受ける。空のままコードを書き始めない。
        受け入れ条件1つに対してテストが1つとは限らない。境界・異常系を明示的に列挙する。

        **現実に起きる値を入れて、具体的な期待値で確かめる。** 「〜を含まない」のような
        否定形や性質のチェックへ寄せない——厳密にしようとするほど条件を並べることになり、
        実装をテストへ書き写す方向へ行く。**期待値が仕様の変更で書き換わるのは正常。**

        **境目は「入力と検証のあいだに振る舞いがあるか」。** 実装が置いた定数を
        読み返すだけの検証は、書き換え忘れ以外の落ち方が無い。値で書くこと自体は悪くない。

        各ケースに以下を書く:
        - テスト関数名（実装時の名前をそのまま）
        - 種別（unit / integration）
        - 投入データの件数と内容（何件・どの値・どこを欠損させるか）
        - 検証する値

        データ件数は「例外が起きる経路を実際に通るか」を左右する。
        1件だけのデータでは早期returnして素通りすることがある。
      value: |
        | # | テスト関数名 | 種別 | 投入データ | 検証内容 |
        |---|---|---|---|---|
        | 1 |  | unit |  |  |
        | 2 |  | integration |  |  |

        **修正前のコードに対して Red になることを確認する対象:**

        - [ ] （どのテストが、どの修正前コードに対して失敗するか）
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 変更確認（この変更のときに1回だけ）
      description: |
        **入った時点で二度と落ちない検証はここへ書く。** テストの形にすると実行時間だけが残る。

        自動で検証できないもの（描画結果・レイアウト・言語の混在・本番への適用）も
        ここへ落とす。テストにしても設定値を読み直すだけになる。
      value: |
        - [ ] （何をどう確かめるか。実機・preview・実測値で）
    validations:
      required: false

  - type: textarea
    id: invariants
    attributes:
      label: このプロジェクトの一線の確認
      description: |
        本プラグインは2つの不変条件の上に成り立つ。触れる変更では、守られていることを
        テストで示す。
        1. 索引時とクエリ時に同一の正規化を通す（片側だけに掛けると取りこぼす。
           これは Joplin 本体が実際に踏んでいる不具合そのもの）
        2. Joplin 本体の database.sqlite へ書き込まない
      value: |
        - [ ] この変更は正規化またはトークン化に触れる
        - [ ] 触れる場合、索引側とクエリ側の双方に同じ関数が通ることを検証するテストがある（テスト名: ）
        - [ ] この変更は Joplin 本体の DB に触れる。触れる場合、読み取り専用であることの根拠:
    validations:
      required: false
